<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>대시보드 · 만족도 조사</title><link rel="stylesheet" href="style.css">
<style>.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.ib{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.ib .lb{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ib .tr{flex:1;height:12px;background:var(--bd);border-radius:6px}.ib .tr i{display:block;height:100%;border-radius:6px}.ib b{flex:0 0 38px;text-align:right}
.ins li{margin:6px 0}.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}.up{color:#1b8a5a}.dn{color:#d34a4a}svg{width:100%;height:auto}svg text{font-size:11px;fill:#5b6879}</style></head><body>
<header class="noprint"><div class="bar"><div class="brand">한국공학대학교 일학습병행 공동훈련센터 지원단<small>만족도 조사 대시보드</small></div><a href="admin.html">관리자(결과·보고서) ↗</a></div></header>
<main>
<div id="lg" class="card" style="max-width:420px;margin:40px auto"><h2>관리자 확인</h2><label class="f" for="pw">관리자 키</label><input type="password" id="pw" autocomplete="current-password"><div id="le" class="err"></div><button class="btn" id="go">확인</button></div>
<div id="db" class="hide">
<div class="stats" id="kp"></div>
<div class="card"><h2>핵심 요약</h2><ul class="ins" id="ins" style="margin:0;padding-left:20px"></ul></div>
<div class="card"><h2>과정별 만족도 추이</h2><div id="tr"></div></div>
<div class="g2"><div class="card"><h2>문항별 평균 (낮은 순)</h2><div id="it"></div><p class="mut">■ 4.5 이상 우수 · ■ 4.0~4.49 양호 · ■ 4.0 미만 개선 필요</p></div>
<div class="card"><h2>영역별 평균</h2><div id="ct"></div><h2 style="margin-top:20px">향후 개설 희망 과정</h2><div id="wh"></div></div></div>
<div class="card"><h2>과정별 비교</h2><div class="scroll"><table id="tb"></table></div></div>
<div class="card"><h2>최근 건의 사항</h2><div id="sg"></div></div>
<p class="mut noprint"><button class="btn sec" id="rf">새로고침</button></p>
</div></main>
<script src="config.js"></script><script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDS=CATS.flatMap(([,q])=>q.map(x=>x[0])),TXT=Object.fromEntries(CATS.flatMap(([,q])=>q));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN,f2=x=>isNaN(x)?"-":x.toFixed(2);
const col=v=>v>=4.5?"#1b8a5a":v>=4?"#e3c24a":"#d34a4a";
const iA=(rs,id)=>avg(rs.map(r=>r.sc[id]).filter(Boolean)),cA=(rs,ids)=>avg(ids.map(i=>iA(rs,i)).filter(x=>!isNaN(x))),oA=rs=>cA(rs,IDS);
const ds=r=>{const m=(r.date||"").match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);return m?m[1]+m[2].padStart(2,"0")+m[3].padStart(2,"0"):(r.at||"").slice(0,10).replace(/-/g,"")};
let KEY="";
async function load(){const r=await fetch(SURVEY_API+"?action=results&key="+encodeURIComponent(KEY)),j=await r.json();if(!j.ok)throw 0;return j.responses}
async function run(){const all=await load(),m=new Map();
 all.forEach(r=>{const k=(r.course||"(과정 미지정)")+"|"+(r.date||"");if(!m.has(k))m.set(k,{t:r.course||"(과정 미지정)",d:r.date||"",s:ds(r),rs:[]});m.get(k).rs.push(r)});
 const G=[...m.values()].sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);render(all,G)}
function render(all,G){
 const last=G[G.length-1],prev=G[G.length-2],tot=oA(all),lv=last?oA(last.rs):NaN,pv=prev?oA(prev.rs):NaN,dl=lv-pv;
 $("kp").innerHTML=`<div class="stat"><div>${G.length}</div><span>진행 과정 수</span></div><div class="stat"><div>${all.length}</div><span>누적 응답</span></div><div class="stat"><div>${f2(tot)}</div><span>전체 평균 (5점)</span></div><div class="stat"><div>${f2(lv)}</div><span>최근 과정 평균${!isNaN(dl)?` <b class="${dl>=0?"up":"dn"}">${dl>=0?"▲":"▼"}${Math.abs(dl).toFixed(2)}</b>`:""}</span></div>`;
 const it=IDS.map(id=>[id,iA(all,id)]).filter(x=>!isNaN(x[1])).sort((a,b)=>a[1]-b[1]);
 $("it").innerHTML=it.map(([id,v])=>`<div class="ib" title="${esc(TXT[id])}"><span class="lb">${id} ${esc(TXT[id])}</span><span class="tr"><i style="width:${v/5*100}%;background:${col(v)}"></i></span><b>${v.toFixed(2)}</b></span></div>`).join("")||'<span class="mut">데이터가 없습니다.</span>';
 const cats=CATS.map(([c,q])=>[c,cA(all,q.map(x=>x[0]))]);
 $("ct").innerHTML=cats.map(([c,v])=>`<div class="ib"><span class="lb">${c}</span><span class="tr"><i style="width:${(v||0)/5*100}%;background:${col(v)}"></i></span><b>${f2(v)}</b></div>`).join("");
 const wc=new Map();all.forEach(r=>(r.c2||"").split(/[\n,;/]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const k=s.replace(/\s+/g," ");wc.set(k,(wc.get(k)||0)+1)}));
 const wl=[...wc].sort((a,b)=>b[1]-a[1]).slice(0,8);
 $("wh").innerHTML=wl.length?wl.map(([k,n])=>`<div class="ib"><span class="lb" style="flex-basis:75%">${esc(k)}</span><b style="flex:1">${n}건</b></div>`).join(""):'<span class="mut">등록된 희망 과정이 없습니다.</span>';
 const ins=[];
 if(!isNaN(tot))ins.push(`누적 ${all.length}명 응답, 전체 평균 <b>${tot.toFixed(2)}점</b>입니다.`);
 if(!isNaN(dl))ins.push(`최근 과정(${esc(last.t)})은 직전 과정보다 <b class="${dl>=0?"up":"dn"}">${dl>=0?"+":""}${dl.toFixed(2)}점</b> ${dl>=0?"상승":"하락"}했습니다.`);
 const cs=cats.filter(x=>!isNaN(x[1])).sort((a,b)=>b[1]-a[1]);if(cs.length>1)ins.push(`가장 높은 영역은 <b>${cs[0][0]}</b>(${cs[0][1].toFixed(2)}), 가장 낮은 영역은 <b>${cs[cs.length-1][0]}</b>(${cs[cs.length-1][1].toFixed(2)})입니다.`);
 const bad=it.filter(x=>x[1]<4).slice(0,3);if(bad.length)ins.push(`<b>개선 필요</b>(4.0 미만): ${bad.map(([id,v])=>`${id} ${esc(TXT[id])} (${v.toFixed(2)})`).join(" / ")}`);else if(it.length)ins.push(`모든 문항이 4.0 이상입니다. 가장 낮은 문항은 ${it[0][0]} (${it[0][1].toFixed(2)})입니다.`);
 if(it.length)ins.push(`가장 높은 문항: ${it[it.length-1][0]} ${esc(TXT[it[it.length-1][0]])} (${it[it.length-1][1].toFixed(2)})`);
 if(wl.length)ins.push(`가장 많이 요청된 과정: <b>${esc(wl[0][0])}</b> (${wl[0][1]}건)`);
 $("ins").innerHTML=ins.map(s=>`<li>${s}</li>`).join("")||"<li>응답이 없습니다.</li>";
 chart(G);
 $("tb").innerHTML=`<tr><th class="l">과정</th><th>일자</th><th>응답</th><th>전체</th>${CATS.map(([c])=>`<th>${c}</th>`).join("")}</tr>`+[...G].reverse().map(g=>`<tr><td class="l">${esc(g.t)}</td><td>${esc(g.d)}</td><td>${g.rs.length}</td><td><b>${f2(oA(g.rs))}</b></td>${CATS.map(([,q])=>`<td>${f2(cA(g.rs,q.map(x=>x[0])))}</td>`).join("")}</tr>`).join("");
 const sg=[...all].reverse().filter(r=>r.c1).slice(0,10);
 $("sg").innerHTML=sg.length?sg.map(r=>`<div class="cm">${esc(r.c1)}<div class="mut">${esc(r.course||"")} · ${esc(r.date||"")}</div></div>`).join(""):'<span class="mut">등록된 건의 사항이 없습니다.</span>'}
function chart(G){const el=$("tr");if(G.length<2){el.innerHTML='<span class="mut">과정이 2개 이상 쌓이면 추이 그래프가 표시됩니다.</span>';return}
 const W=640,H=230,L=36,R=12,T=14,B=44,S=[["전체","var(--pri)",G.map(g=>oA(g.rs)),3],...CATS.map(([c,q],i)=>[c,["#1b8a5a","#e8914a","#8a5ad6"][i],G.map(g=>cA(g.rs,q.map(x=>x[0]))),1.6])];
 const v=S.flatMap(s=>s[2]).filter(x=>!isNaN(x)),lo=Math.max(1,Math.floor(Math.min(...v)-0.5)),hi=5,X=i=>L+(W-L-R)*(G.length<2?.5:i/(G.length-1)),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="과정별 만족도 추이">`;
 for(let y=lo;y<=hi;y+=.5)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="#dbe3ee"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${y.toFixed(1)}</text>`;
 G.forEach((g,i)=>{const t=(g.d||g.t).replace(/\.\(.\)/,"").slice(0,12);s+=`<text x="${X(i)}" y="${H-24}" text-anchor="middle">${esc(t)}</text>`});
 S.forEach(([n,c,d,w],k)=>{const p=d.map((y,i)=>isNaN(y)?null:[X(i),Y(y),y]).filter(Boolean);s+=`<polyline fill="none" style="stroke:${c}" stroke-width="${w}" points="${p.map(q=>q[0]+","+q[1]).join(" ")}"/>`;p.forEach(q=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${k?3:4.5}" style="fill:${c}"/>`;if(!k)s+=`<text x="${q[0]}" y="${q[1]-9}" text-anchor="middle" style="fill:${c};font-weight:700">${q[2].toFixed(2)}</text>`})});
 S.forEach(([n,c],i)=>{s+=`<rect x="${L+i*100}" y="${H-12}" width="10" height="10" rx="2" style="fill:${c}"/><text x="${L+i*100+14}" y="${H-3}">${n}</text>`});
 el.innerHTML=s+"</svg>"}
$("go").onclick=async()=>{KEY=$("pw").value;$("le").textContent="";try{await run();$("lg").classList.add("hide");$("db").classList.remove("hide");sessionStorage.setItem("k",KEY)}catch(e){$("le").textContent="키가 올바르지 않거나 서버에 연결할 수 없습니다."}};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("rf").onclick=()=>run().catch(()=>alert("불러오기 실패"));
try{const k=sessionStorage.getItem("k");if(k){$("pw").value=k;$("go").click()}}catch(e){}
</script></body></html>
